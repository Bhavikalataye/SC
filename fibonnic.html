<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Sequence</title>
</head>
<body>

<h3>Fibonacci Sequence</h3>

<script>
    
    let n = Number(prompt("Enter number of terms for Fibonacci sequence:"));

    let a = 0, b = 1;
    let fib = "";

    for (let i = 1; i <= n; i++) {
        fib += a + " ";
        let next = a + b;
        a = b;
        b = next;
    }

    document.write("Fibonacci Sequence: " + fib);
</script>

</body>
</html>
